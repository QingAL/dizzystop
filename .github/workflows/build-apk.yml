name: Build Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-apk-main
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore release keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          for variable in SIGNING_KEYSTORE_BASE64 SIGNING_KEY_ALIAS SIGNING_KEYSTORE_PASSWORD SIGNING_KEY_PASSWORD; do
            if [ -z "${!variable}" ]; then
              echo "Missing repository secret: $variable"
              exit 1
            fi
          done
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/dizzystop-release.jks"
          printf '%s\n' \
            "storeFile=$RUNNER_TEMP/dizzystop-release.jks" \
            "storePassword=$SIGNING_KEYSTORE_PASSWORD" \
            "keyAlias=$SIGNING_KEY_ALIAS" \
            "keyPassword=$SIGNING_KEY_PASSWORD" \
            > keystore.properties

      - name: Build release APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease --stacktrace

      - name: Verify and name release APK
        run: |
          BUILD_TOOLS_VERSION="$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner"
          RELEASE_APK="app/build/outputs/apk/release/app-release.apk"
          SIGNED_APK="app/build/outputs/apk/release/DizzyStop-release-main-${{ github.run_number }}.apk"

          mv "$RELEASE_APK" "$SIGNED_APK"
          "$APKSIGNER" verify --verbose --print-certs "$SIGNED_APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DizzyStop-release-main-${{ github.run_number }}
          path: app/build/outputs/apk/release/DizzyStop-release-main-${{ github.run_number }}.apk
          if-no-files-found: error
          retention-days: 30

      - name: Remove signing files
        if: always()
        run: rm -f "$RUNNER_TEMP/dizzystop-release.jks" keystore.properties
